<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="/dashboard">WhatsApp Bot Platform</a>
      <div><span class="text-white me-3">{{ user.name or user.email }}</span><a href="/logout" class="btn btn-sm btn-light">Logout</a></div>
    </div>
  </nav>
  <div class="container py-4">
    <h2>Dashboard</h2>
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card"><div class="card-body"><h6>Pending Jobs</h6><h3 id="pending">-</h3></div></div></div>
      <div class="col-md-3"><div class="card"><div class="card-body"><h6>Sent</h6><h3 id="sent">-</h3></div></div></div>
      <div class="col-md-3"><div class="card"><div class="card-body"><h6>Failed</h6><h3 id="failed">-</h3></div></div></div>
      <div class="col-md-3"><div class="card"><div class="card-body"><h6>Campaigns</h6><h3 id="campaigns">-</h3></div></div></div>
    </div>
    <div class="card">
      <div class="card-header">Quick Send</div>
      <div class="card-body">
        <form id="sendForm">
          <div class="mb-2"><input class="form-control" name="phone" placeholder="+233..." required></div>
          <div class="mb-2"><textarea class="form-control" name="message" placeholder="Message" required></textarea></div>
          <button class="btn btn-success">Send Now</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    async function load() {
      const r = await fetch('/api/v1/analytics/summary', {credentials:'same-origin'});
      if(!r.ok) return;
      const d = await r.json();
      document.getElementById('pending').textContent = d.pending_jobs;
      document.getElementById('sent').textContent = d.delivery.success;
      document.getElementById('failed').textContent = d.delivery.failed;
      document.getElementById('campaigns').textContent = d.campaigns;
    }
    load();
    document.getElementById('sendForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = new FormData(e.target);
      await fetch('/api/v1/messages/send', {method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({phone:f.get('phone'), message:f.get('message')})});
      e.target.reset(); load();
    });
  </script>
</body>
</html>
